name: CI
 
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
 
jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 120
 
    steps:
      # 1️⃣ Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
 
      # 2️⃣ Install VS2019 Build Tools
      - name: Install VS2019 Build Tools
        run: choco install visualstudio2019buildtools --package-parameters "--add Microsoft.VisualStudio.Component.VC.Tools.x86.x64 --add Microsoft.VisualStudio.Component.Windows10SDK.19041 --includeRecommended --includeOptional --quiet --norestart" --yes
 
      # 3️⃣ Setup MSBuild
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '[16.0,17.0)'
 
      # 4️⃣ Setup JDK 17 (Amazon Corretto)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'
 
      # 5️⃣ Setup Node.js 16.3.0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '16.3.0'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'
 
      # 6️⃣ Setup Python 3.10
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
 
      # 7️⃣ Configure node-gyp for npm builds
      - name: Configure node-gyp
        run: npm config set msvs_version 2019
 
      # 8️⃣ Skip Gradle setup
      - name: Skip Gradle setup
        shell: pwsh
        run: |
          Write-Host "Skipping Gradle setup - using Node.js only"
          
      - name: Create libs folder
        shell: pwsh
        run: |
          if (-not (Test-Path "libs")) {
              New-Item -ItemType Directory -Path "libs"
          }
          
      # 9️⃣ Skip Gradle plugin setup
      - name: Skip Gradle plugin setup
        shell: pwsh
        run: |
          Write-Host "Skipping Gradle plugin setup - not required for Node.js tests"

 
      # 🔟 Skip Gradle build
      - name: Skip Gradle build
        shell: pwsh
        run: |
          Write-Host "Skipping Gradle build - API module not required"
 
      # 1️⃣1️⃣ Install npm dependencies
      - name: Install npm dependencies
        shell: pwsh
        run: npm ci --prefer-offline
 
      # 1️⃣2️⃣ Skip URL check and API build
      - name: Skip URL check and API build
        shell: pwsh
        run: |
          Write-Host "Skipping URL accessibility check - GitHub Actions cannot access internal networks"
          Write-Host "Skipping Gradle build - using npm scripts only"
 
      # 1️⃣3️⃣ Run GT UI Tests
      - name: Run GT UI Tests
        shell: pwsh
        working-directory: ${{ github.workspace }}
        env:
          SKIP_API_BUILD: true
          GT_SKIP_GRADLE: true
          CC_URL: https://cc-dev-gwcpdev.valuemom.zeta1-andromeda.guidewire.net/ClaimCenter.do
          USERNAME: su
          PASSWORD: gw
        run: |
          try {
              Write-Host "Running GT UI tests..."
              npm run gt-ui-tests -- --cucumberTags=@add_activity --pageRequestTimeout=60000 --retryTestPages
          } catch {
              Write-Host "GT UI tests failed, trying direct TestCafe..."
              npx testcafe chrome:headless "ui/tests/**/*.js" --reporter spec
          }
name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      # 1️⃣ Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2️⃣ Install VS2019 Build Tools
      - name: Install VS2019 Build Tools
        run: choco install visualstudio2019buildtools --package-parameters "--add Microsoft.VisualStudio.Component.VC.Tools.x86.x64 --add Microsoft.VisualStudio.Component.Windows10SDK.19041 --includeRecommended --includeOptional --quiet --norestart" --yes

      # 3️⃣ Setup MSBuild
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '[16.0,17.0)'

      # 4️⃣ Setup JDK 11 (Amazon Corretto)
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'corretto'

      # 5️⃣ Setup Node.js 16.3.0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '16.3.0'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      # 6️⃣ Setup Python 3.10
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 7️⃣ Configure node-gyp for npm builds
      - name: Configure node-gyp
        run: npm config set msvs_version 2019

      # 8️⃣ Download Gradle 6.5.1 manually
      - name: Download Gradle 6.5.1
        shell: pwsh
        run: |
          $gradleVersion = "6.5.1"
          $gradleZip = "$env:TEMP\gradle-$gradleVersion-bin.zip"
          Invoke-WebRequest -Uri "https://services.gradle.org/distributions/gradle-$gradleVersion-bin.zip" -OutFile $gradleZip
          Expand-Archive -Path $gradleZip -DestinationPath "$env:TEMP\gradle-$gradleVersion"
          $env:PATH = "$env:TEMP\gradle-$gradleVersion\gradle-$gradleVersion\bin;$env:PATH"
          Write-Host "Gradle $gradleVersion downloaded and PATH updated"

      # 9️⃣ Ensure libs folder exists
      - name: Create libs folder
        shell: pwsh
        run: |
          if (-not (Test-Path "libs")) {
              New-Item -ItemType Directory -Path "libs"
          }

      # 🔟 Install npm dependencies
      - name: Install npm dependencies
        shell: pwsh
        run: npm ci --prefer-offline

      # 1️⃣1️⃣ Run GT UI Tests (with wrapper repair logic)
      - name: Run GT UI Tests
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          Write-Host "Repo root: $PWD"
          java -version
          node -v

          $jar = Join-Path $PWD 'gradle\wrapper\gradle-wrapper.jar'
          $props = Join-Path $PWD 'gradle\wrapper\gradle-wrapper.properties'

          if (-not (Test-Path $props)) {
            Write-Host "gradle-wrapper.properties missing -> generating wrapper (6.5.1)"
            gradle wrapper --gradle-version 6.5.1
          }

          if (-not (Test-Path $jar)) {
            Write-Host "gradle-wrapper.jar missing -> trying Git LFS pull..."
            git lfs install 2>$null
            git lfs pull 2>$null
          }

          $isPointer = $false
          if (Test-Path $jar) {
            try {
              $first = Get-Content $jar -TotalCount 1 -Raw -ErrorAction Stop
              if ($first -match 'git-lfs') { $isPointer = $true }
            } catch { $isPointer = $true }
          }

          if ((-not (Test-Path $jar)) -or $isPointer) {
            Write-Host "gradle-wrapper.jar is missing or an LFS pointer -> generating wrapper (6.5.1)"
            gradle wrapper --gradle-version 6.5.1
          }

          .\gradlew.bat -v
          npm run gt-ui-tests -- --cucumberTags=@add_activity

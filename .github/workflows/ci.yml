name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      # 1️⃣ Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true   # 👈 ensures Git LFS files like gradle-wrapper.jar are pulled

      # 2️⃣ Install VS2019 Build Tools
      - name: Install VS2019 Build Tools
        run: choco install visualstudio2019buildtools --package-parameters "--add Microsoft.VisualStudio.Component.VC.Tools.x86.x64 --add Microsoft.VisualStudio.Component.Windows10SDK.19041 --includeRecommended --includeOptional --quiet --norestart" --yes

      # 3️⃣ Setup MSBuild
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '[16.0,17.0)'

      # 4️⃣ Setup JDK 11 (Amazon Corretto)
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'corretto'

      # 5️⃣ Setup Node.js 16.3.0 with npm cache
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '16.3.0'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      # 6️⃣ Setup Python 3.10
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 7️⃣ Configure node-gyp for npm builds
      - name: Configure node-gyp
        run: npm config set msvs_version 2019

      # 8️⃣ Download Gradle 6.5.1 manually
      - name: Download Gradle 6.5.1
        shell: pwsh
        run: |
          $gradleVersion = "6.5.1"
          $gradleZip = "$env:TEMP\gradle-$gradleVersion-bin.zip"
          Invoke-WebRequest -Uri "https://services.gradle.org/distributions/gradle-$gradleVersion-bin.zip" -OutFile $gradleZip
          Expand-Archive -Path $gradleZip -DestinationPath "$env:TEMP\gradle-$gradleVersion"
          $env:PATH = "$env:TEMP\gradle-$gradleVersion\gradle-$gradleVersion\bin;$env:PATH"
          Write-Host "Gradle $gradleVersion downloaded and PATH updated"

      # 9️⃣ Ensure libs folder exists
      - name: Create libs folder
        shell: pwsh
        run: |
          if (-not (Test-Path "libs")) {
            New-Item -ItemType Directory -Path "libs"
          }

      # 🔟 Install npm dependencies with retry
      - name: Install dependencies with retry
        shell: pwsh
        run: |
          $maxRetries = 5
          for ($i = 1; $i -le $maxRetries; $i++) {
            try {
              npm ci
              if ($LASTEXITCODE -eq 0) {
                Write-Host "npm ci succeeded"
                break
              }
            } catch {
              Write-Host "npm ci failed, attempt $i of $maxRetries"
            }
            if ($i -eq $maxRetries) { exit 1 }
            Start-Sleep -Seconds 15
          }

      # 1️⃣3️⃣ Run GT UI Tests (robust, Gradle 6.5.1-safe)
      - name: Run GT UI Tests
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          Write-Host "Repo root: $PWD"
          java -version
          node -v

          $jar   = Join-Path $PWD 'gradle\wrapper\gradle-wrapper.jar'
          $props = Join-Path $PWD 'gradle\wrapper\gradle-wrapper.properties'

          # 1) Try to fetch real wrapper via Git LFS (if tracked there)
          git lfs install 2>$null
          git lfs pull 2>$null

          function Test-IsLfsPointer($path) {
            if (-not (Test-Path $path)) { return $true }
            try {
              $firstLine = Get-Content $path -TotalCount 1 -Raw -ErrorAction Stop
              return ($firstLine -match 'git-lfs|version https://git-lfs.github.com/spec')
            } catch { return $true }
          }

          $needsWrapper = $false
          if (-not (Test-Path $props)) {
            Write-Host "gradle-wrapper.properties missing."
            $needsWrapper = $true
          } elseif (Test-IsLfsPointer $jar) {
            Write-Host "gradle-wrapper.jar missing or an LFS pointer."
            $needsWrapper = $true
          }

          if ($needsWrapper) {
            Write-Host "Bootstrapping Gradle 6.5.1 locally to generate wrapper..."
            $ver = "6.5.1"
            $tmp = Join-Path $env:TEMP "gradle-$ver"
            $zip = Join-Path $env:TEMP "gradle-$ver-bin.zip"
            if (-not (Test-Path $tmp)) {
              Invoke-WebRequest -Uri "https://services.gradle.org/distributions/gradle-$ver-bin.zip" -OutFile $zip
              Expand-Archive -Path $zip -DestinationPath $env:TEMP -Force
            }
            $gradleBat = Join-Path $env:TEMP "gradle-$ver\bin\gradle.bat"

            if (-not (Test-Path $props)) {
              New-Item -ItemType Directory -Path (Split-Path $props) -Force | Out-Null
              @"
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-$ver-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          "@ | Out-File -FilePath $props -Encoding ascii -Force
            }

            & $gradleBat wrapper --gradle-version $ver
            if ($LASTEXITCODE -ne 0) { throw "Failed to generate Gradle wrapper $ver" }
          }

          if (-not (Test-Path .\gradlew.bat)) { throw "gradlew.bat not found at repo root" }
          .\gradlew.bat -v

          npm run gt-ui-tests -- --cucumberTags=@add_activity

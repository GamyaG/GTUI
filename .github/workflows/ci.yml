name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      # 1️⃣ Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2️⃣ Install VS2019 Build Tools
      - name: Install VS2019 Build Tools
        run: choco install visualstudio2019buildtools --package-parameters "--add Microsoft.VisualStudio.Component.VC.Tools.x86.x64 --add Microsoft.VisualStudio.Component.Windows10SDK.19041 --includeRecommended --includeOptional --quiet --norestart" --yes

      # 3️⃣ Setup MSBuild
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '[16.0,17.0)'

      # 4️⃣ Setup JDK 11 (Amazon Corretto)
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'corretto'

      # 5️⃣ Setup Node.js 16.3.0 with npm cache
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '16.3.0'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      # 6️⃣ Setup Python 3.10
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 7️⃣ Configure node-gyp for npm builds
      - name: Configure node-gyp
        run: npm config set msvs_version 2019

      # 8️⃣ Download Gradle 6.5.1 manually
      - name: Download Gradle 6.5.1
        shell: pwsh
        run: |
          $gradleVersion = "6.5.1"
          $gradleZip = "$env:TEMP\gradle-$gradleVersion-bin.zip"
          Invoke-WebRequest -Uri "https://services.gradle.org/distributions/gradle-$gradleVersion-bin.zip" -OutFile $gradleZip
          Expand-Archive -Path $gradleZip -DestinationPath "$env:TEMP\gradle-$gradleVersion"
          $env:PATH = "$env:TEMP\gradle-$gradleVersion\gradle-$gradleVersion\bin;$env:PATH"
          Write-Host "Gradle $gradleVersion downloaded and PATH updated"

      # 9️⃣ Ensure libs folder exists
      - name: Create libs folder
        shell: pwsh
        run: |
          if (-not (Test-Path "libs")) {
              New-Item -ItemType Directory -Path "libs"
          }

      # 🔟 Install npm dependencies with retry
      - name: Install dependencies with retry
        shell: pwsh
        run: |
          $maxRetries = 5
          for ($i = 1; $i -le $maxRetries; $i++) {
            try {
              npm ci
              if ($LASTEXITCODE -eq 0) {
                Write-Host "npm ci succeeded"
                break
              }
            } catch {
              Write-Host "npm ci failed, attempt $i of $maxRetries"
            }
            if ($i -eq $maxRetries) { exit 1 }
            Start-Sleep -Seconds 15
          }

      # 1️⃣3️⃣ Run GT UI Tests (clean version)
      - name: Run GT UI Tests
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          Write-Host "Repo root: $PWD"
          java -version
          node -v

          # Check wrapper jar
          if (-not (Test-Path .\gradle\wrapper\gradle-wrapper.jar)) {
            throw "gradle-wrapper.jar missing! Please commit it into repo (not via Git LFS)."
          }

          # Quick smoke test
          .\gradlew.bat -v

          # Run tests
          npm run gt-ui-tests -- --cucumberTags=@add_activity
